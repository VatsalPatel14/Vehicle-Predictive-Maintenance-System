{% extends "layout.html" %}
{% block content %}

<div style="font-size: 28px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; margin-bottom: 25px;">📊 Analytics Dashboard</div>

<!-- GRAPHS -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px;">

    <!-- feature importance -->
    <div class="card" style="display: flex; flex-direction: column;">
        <h3 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 20px;">Feature Importance</h3>
        <div style="width: 100%; flex: 1; background: #f8fafc; border-radius: 16px; padding: 15px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center;">
            <img src="data:image/png;base64,{{ g3 }}" style="width: 100%; height: auto; border-radius: 8px; object-fit: contain;">
        </div>
    </div>

    <!-- vehicle age -->
    <div class="card" style="display: flex; flex-direction: column;">
        <h3 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 20px;">Vehicle Age vs Maintenance</h3>
        <div style="width: 100%; flex: 1; background: #f8fafc; border-radius: 16px; padding: 15px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center;">
            <img src="data:image/png;base64,{{ g1 }}" style="width: 100%; height: auto; border-radius: 8px; object-fit: contain;">
        </div>
    </div>

    <!-- reported issues -->
    <div class="card" style="display: flex; flex-direction: column;">
        <h3 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 20px;">Reported Issues Analysis</h3>
        <div style="width: 100%; flex: 1; background: #f8fafc; border-radius: 16px; padding: 15px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center;">
            <img src="data:image/png;base64,{{ g2 }}" style="width: 100%; height: auto; border-radius: 8px; object-fit: contain;">
        </div>
    </div>

    <!-- service history -->
    <div class="card" style="display: flex; flex-direction: column;">
        <h3 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 20px;">Service History Analysis</h3>
        <div style="width: 100%; flex: 1; background: #f8fafc; border-radius: 16px; padding: 15px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center;">
            <img src="data:image/png;base64,{{ g4 }}" style="width: 100%; height: auto; border-radius: 8px; object-fit: contain;">
        </div>
    </div>

</div>

{% endblock %}
