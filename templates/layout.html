<!-- Charts (vehicle trends / ML accuracy)
Smart “Vehicle Health Score” -->

<!DOCTYPE html>
<html>
<head>
<title>Vehicle App</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Outfit', sans-serif;
}

body{
    display:flex;
    height:100vh;
    /* Soft, elegant white/light theme with very subtle dynamic movement */
    background: linear-gradient(-45deg, #ffffff, #f8fafc, #f1f5f9, #fdf4ff);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: #1e293b;
    overflow: hidden;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-right: 1px solid rgba(0, 0, 0, 0.03);
    padding: 30px 20px;
    display:flex;
    flex-direction:column;
    z-index: 10;
    box-shadow: 5px 0 30px rgba(0,0,0,0.01);
}

.sidebar h2 {
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 40px;
    text-align: center;
    background: linear-gradient(135deg, #3b82f6, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
}

.sidebar a{
    display:flex;
    align-items:center;
    padding:14px 18px;
    margin:6px 0;
    color: #64748b;
    text-decoration:none;
    border-radius:14px;
    font-weight: 500;
    font-size: 1.05rem;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}

.sidebar a::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%) scaleY(0);
    width: 4px;
    height: 60%;
    background: #3b82f6;
    transition: transform 0.3s ease;
    border-radius: 0 4px 4px 0;
}

.sidebar a:hover{
    background: rgba(0, 0, 0, 0.02);
    color: #1e293b;
    transform: translateX(4px);
}

.sidebar a.active-link {
    background: #eff6ff;
    color: #2563eb;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.05);
}
.sidebar a.active-link::before {
    transform: translateY(-50%) scaleY(1);
    background: #2563eb;
    box-shadow: 0 0 10px rgba(37, 99, 235, 0.2);
}

/* MAIN */
.main{
    flex:1;
    padding: 40px 50px;
    overflow-y:auto;
    position: relative;
}

/* GLOWING AMBIENT DECORATION */
.main::before {
    content: '';
    position: fixed;
    top: -150px;
    right: -150px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
    animation: floatAmbient 12s infinite ease-in-out alternate;
}

.main::after {
    content: '';
    position: fixed;
    bottom: -150px;
    left: 200px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(236, 72, 153, 0.03) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
    animation: floatAmbient 15s infinite ease-in-out alternate-reverse;
}

@keyframes floatAmbient {
    0% { transform: translateY(0) scale(1) translateX(0); }
    100% { transform: translateY(60px) scale(1.1) translateX(-30px); }
}

/* CARD / GLASSMORPHISM BASE */
.card{
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.03);
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.01);
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 25px 50px rgba(0,0,0,0.04), 0 5px 15px rgba(0,0,0,0.02);
}

.card h2, .card h3 {
    color: #0f172a;
    margin-bottom: 20px;
}

/* ========================= */
/* 🔥 FLOATING NOTIFICATIONS */
/* ========================= */

.flash-container{
    position:fixed;
    top:30px;
    right:30px;
    z-index:9999;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.flash{
    min-width:320px;
    padding:18px 24px;
    border-radius:16px;
    color: #1e293b;
    font-weight: 500;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(0, 0, 0, 0.05);
    box-shadow: 0 15px 35px rgba(0,0,0,0.05), 0 5px 10px rgba(0,0,0,0.02);
    display: flex;
    align-items: center;
    gap: 15px;
    animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transition: all 0.4s ease;
    overflow: hidden;
    position: relative;
    padding-bottom: 22px;
}

.flash::after {
    content: '';
    height: 4px;
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    animation: shrinkLine 3s linear forwards;
}

@keyframes shrinkLine {
    0% { width: 100%; }
    100% { width: 0%; }
}

/* COLORS */
.success::after { background: #10b981; }
.error::after { background: #ef4444; }

/* EXIT ANIMATION */
.flash.hide{
    opacity:0;
    transform:translateX(120%);
}

/* ENTRY ANIMATION */
@keyframes slideIn{
    from{ opacity:0; transform:translateX(100%); }
    to{ opacity:1; transform:translateX(0); }
}

/* ========================= */
/* OTHER UI OVERRIDES */
/* ========================= */

.cards{display:flex;gap:25px;}

.vehicle-list{ display:flex; gap:25px; flex-wrap:wrap; }

.vehicle-card{
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.03);
    padding:25px;
    width:240px;
    border-radius:20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.02);
    color: #334155;
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    flex-direction: column;
}

.vehicle-card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: rgba(59, 130, 246, 0.1);
    box-shadow: 0 25px 40px rgba(59, 130, 246, 0.08);
}

.vehicle-card h3 {
    color: #0f172a;
    font-size: 1.2rem;
    margin-bottom: 10px;
}

input, select, textarea {
    display:block;
    margin:12px 0;
    padding:16px 20px;
    width:100%;
    max-width: 350px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    color: #1e293b;
    outline: none;
    font-size: 1rem;
    transition: all 0.3s ease;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
}

input::placeholder, select::placeholder { color: #94a3b8; }

input:focus, select:focus, textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    background: #ffffff;
}

button{
    padding:14px 28px;
    background: #0f172a;
    color: #ffffff;
    border:none;
    border-radius:14px;
    font-weight: 600;
    font-size: 1rem;
    cursor:pointer;
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}

button::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.2), rgba(255,255,255,0));
    transform: translateX(-100%);
    transition: transform 0.5s ease;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 25px rgba(15, 23, 42, 0.25);
    background: #1e293b;
}

button:hover::after {
    transform: translateX(100%);
}

table{
    width:100%;
    background: #ffffff;
    border-radius: 16px;
    border-collapse: separate;
    border-spacing: 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.02);
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.03);
}

th,td{
    padding:18px 24px;
    text-align:left;
    color: #475569;
}

th{
    background: #f8fafc;
    color: #64748b;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    border-bottom: 2px solid #e2e8f0;
}

td {
    border-bottom: 1px solid #f1f5f9;
}

table tbody tr:last-child td { border-bottom: none; }

table tbody tr {
    transition: background 0.3s ease;
}

table tbody tr:hover {
    background: #f8fafc;
}

.result-card{
    margin-top:25px;
    padding:25px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    border-radius: 16px;
    border-left: 6px solid #10b981;
    color: #065f46;
    box-shadow: 0 10px 20px rgba(16, 185, 129, 0.05);
}

/* Premium Micro Scrollbar */
::-webkit-scrollbar {
    width: 4px;
    height: 4px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.4);
    border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
    background: rgba(148, 163, 184, 0.8);
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>🚗 Vehicle App</h2>
    <a href="/" class="{% if request.path == '/' %}active-link{% endif %}">🏠 Dashboard</a>
    <a href="/vehicles" class="{% if request.path == '/vehicles' %}active-link{% endif %}">🚗 Vehicles</a>
    <a href="/prediction" class="{% if request.path == '/prediction' %}active-link{% endif %}">🔮 Prediction</a>
    <a href="/charts" class="{% if request.path == '/charts' %}active-link{% endif %}">📊 Charts</a>
    <a href="/history" class="{% if request.path == '/history' %}active-link{% endif %}">📁 History</a>
    <a href="/profile" class="{% if request.path == '/profile' %}active-link{% endif %}">👤 Profile</a>

    <div style="margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.05);">
        <a href="/logout" style="color: #ef4444;" onmouseover="this.style.background='#fee2e2'" onmouseout="this.style.background='transparent'">🚪 Logout</a>
    </div>
</div>

<!-- 🔥 FLOATING FLASH -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-container">
      {% for category, message in messages %}
        <div class="flash {{category}}">
          {{message}}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<!-- MAIN -->
<div class="main">
    {% block content %}{% endblock %}
</div>

<!-- AUTO DISAPPEAR & SOUND -->
<script>
function playPop() {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
}

document.addEventListener('DOMContentLoaded', () => {
    const flashes = document.querySelectorAll('.flash');
    if(flashes.length > 0) {
        // Must capture user interaction theoretically, but works in some browser states
        playPop();
    }
});

setTimeout(() => {
    const flashes = document.querySelectorAll('.flash');
    flashes.forEach(flash => {
        flash.classList.add('hide');
        setTimeout(() => {
            flash.remove();
        }, 500);
    });
}, 3000);
</script>

</body>
</html>
