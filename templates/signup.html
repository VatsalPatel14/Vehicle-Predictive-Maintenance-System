<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup - Vehicle App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; font-family:'Outfit', sans-serif; }

body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #f8fafc, #f1f5f9, #e2e8f0, #f8fafc);
    background-size: 300% 300%;
    animation: gradientBG 15s ease infinite;
    color: #1e293b;
    padding: 20px;
    overflow: hidden;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Glassy decorative blobs */
.blob {
    position: absolute; filter: blur(80px); z-index: 0; opacity: 0.6;
    animation: float 10s infinite ease-in-out alternate;
}
.blob-1 { top: -100px; left: -100px; width: 400px; height: 400px; background: #3b82f6; animation-delay: 0s; }
.blob-2 { bottom: -150px; right: 100px; width: 500px; height: 500px; background: #ec4899; animation-delay: -5s; }

@keyframes float {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(40px) scale(1.1); }
}

.auth-container {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border-radius: 24px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.08), 0 10px 20px rgba(0,0,0,0.03);
    border: 1px solid rgba(255,255,255,1);
    padding: 50px 45px;
    z-index: 10;
    animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: center;
    opacity: 0;
    transform: scale(0.95) translateY(20px);
}

@keyframes scaleUp {
    to { opacity: 1; transform: scale(1) translateY(0); }
}

/* BRANDING LOGO ZONE */
.brand-title {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -1px;
    margin-bottom: 5px;
}

.brand-subtitle {
    text-align: center;
    color: #64748b;
    font-size: 1rem;
    margin-bottom: 40px;
}

.input-group {
    margin-bottom: 24px;
    position: relative;
}

.input-group label {
    display: block; font-size: 0.9rem; font-weight: 600; color: #475569; margin-bottom: 8px; margin-left: 4px;
}

.input-group input {
    width: 100%; padding: 16px 20px; background: #f8fafc; border: 2px solid transparent; border-radius: 14px;
    font-size: 1rem; color: #1e293b; outline: none; transition: all 0.3s ease;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.02), 0 0 0 1px #e2e8f0;
}

.input-group input::placeholder { color: #94a3b8; }
.input-group input:focus {
    border-color: #3b82f6; background: #ffffff; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.08), inset 0 2px 5px rgba(0,0,0,0.01);
}

.password-box { position: relative; }
.password-box input { padding-right: 50px; }
.eye { position: absolute; right: 20px; top: 40px; cursor: pointer; color: #94a3b8; padding: 10px; }
.eye:hover { color: #3b82f6; }

button {
    width: 100%; padding: 16px; background: linear-gradient(135deg, #0f172a, #1e293b); color: #ffffff;
    border: none; border-radius: 14px; font-weight: 600; font-size: 1.05rem; cursor: pointer;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    margin-top: 10px;
}
button:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(15, 23, 42, 0.3); }

.links { text-align: center; margin-top: 35px; }
.links a {
    color: #64748b; text-decoration: none; font-weight: 500; font-size: 1rem;
    transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px;
}
.links a:hover { color: #3b82f6; gap: 12px; }

/* FLASH MESSAGES */
.flash-container{ position:fixed; top:30px; right:30px; z-index:9999; display:flex; flex-direction:column; gap:15px; }
.flash{
    min-width:320px; padding:18px 24px; border-radius:16px; color: #1e293b; font-weight: 500;
    background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(0, 0, 0, 0.05);
    box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; align-items: center;
    animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideIn{ from{ opacity:0; transform:translateX(100%); } to{ opacity:1; transform:translateX(0); } }

@media (max-width: 500px) {
    .auth-container { padding: 40px 25px; }
}
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-container">
      {% for category, message in messages %}
        <div class="flash {{category}}">{{message}}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<div class="auth-container">

    <div class="brand-title">Vehicle App.</div>
    <div class="brand-subtitle">Create a new account.</div>

    <form method="POST">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="John Doe" required autocomplete="name">
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="input-group password-box">
            <label>Password</label>
            <input type="password" id="signupPassword" name="password" placeholder="••••••••" required autocomplete="new-password">
            <i class="fas fa-eye eye" onclick="togglePassword('signupPassword', this)"></i>
        </div>

        <button type="submit">Complete Sign Up</button>
    </form>

    <div class="links">
        <a href="/login">
            <i class="fas fa-arrow-left"></i>
            <span>Already have an account? Log in</span>
        </a>
    </div>

</div>

<script>
function togglePassword(id, el){
    const input = document.getElementById(id);
    if(input.type === "password"){
        input.type = "text"; el.classList.remove("fa-eye"); el.classList.add("fa-eye-slash");
    } else {
        input.type = "password"; el.classList.remove("fa-eye-slash"); el.classList.add("fa-eye");
    }
}
</script>

</body>
</html>
