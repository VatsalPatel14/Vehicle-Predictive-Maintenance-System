{% extends "layout.html" %}
{% block content %}

<div style="font-size: 28px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; margin-bottom: 25px;">🚗 Your
    Vehicles</div>

<div class="card" style="margin-bottom: 30px;">
    <h3 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 20px;">Register New Vehicle</h3>
    <form method="POST" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
        <input type="text" name="name" placeholder="Vehicle Name e.g Honda City" required
            style="flex: 1; min-width: 200px; margin: 0; max-width: none;">
        <input type="number" name="mileage" placeholder="Mileage km" required
            style="flex: 1; min-width: 200px; margin: 0; max-width: none;">
        <button type="submit" style="margin: 0; padding: 16px 30px; width: auto;"><i class="fas fa-plus"></i> Add
            Vehicle</button>
    </form>
</div>

<!-- VEHICLE LIST -->
<div
    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; animation: fadeIn 0.6s ease;">
    {% for v in vehicles %}
    <div class="vehicle-card" style="width: 100%;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
            <div
                style="width: 50px; height: 50px; background: #f1f5f9; color: #64748b; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px;">
                <i class="fas fa-car-side"></i>
            </div>
            <a href="/delete_vehicle/{{ v[0] }}"
                style="background: #fee2e2; color: #ef4444; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s;"
                onmouseover="this.style.background='#fecaca'" onmouseout="this.style.background='#fee2e2'">
                <i class="fas fa-trash" style="font-size: 12px;"></i>
            </a>
        </div>

        <h3 style="font-size: 1.3rem; margin-bottom: 5px;">{{ v[1] }}</h3>
        <p style="color: #64748b; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
            <i class="fas fa-tachometer-alt" style="color: #cbd5e1;"></i> {{ v[2] }} km Mileage
        </p>
    </div>
    {% else %}
    <div
        style="grid-column: 1 / -1; background: transparent; border: 2px dashed #cbd5e1; padding: 40px; text-align: center; border-radius: 20px;">
        <i class="fas fa-car" style="font-size: 30px; color: #cbd5e1; margin-bottom: 15px;"></i>
        <h3 style="font-size: 1.2rem; color: #64748b; margin-bottom: 5px;">No Vehicles Registered</h3>
        <p style="color: #94a3b8; font-size: 14px;">Add your first vehicle using the form above to get started.</p>
    </div>
    {% endfor %}
</div>

<style>
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

{% endblock %}
